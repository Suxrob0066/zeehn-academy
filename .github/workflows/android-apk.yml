name: Zeehn Lingo — Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (runner'da tayyor)
        run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3
      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund
      - name: Android loyihasini yaratish
        run: npx cap add android
      - name: Ikonka va splash ekranlar
        run: npm run assets
      - name: Sinxronlash
        run: npx cap sync android
      - name: Versiya raqami
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: APK yig'ish
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zeehn-lingo-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZeehnLingo-1.0.${{ github.run_number }}.apk
      - name: GitHub Release'ga yuklash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lingo-v1.0.${{ github.run_number }}
          name: Zeehn Lingo 1.0.${{ github.run_number }}
          body: "Zeehn Lingo Android ilovasi (test versiya). APK faylni telefonga yuklab o'rnating."
          files: app/ZeehnLingo-1.0.${{ github.run_number }}.apk
          make_latest: true

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeehn Lingo — ingliz tilini o'yin kabi o'rganing</title>
<meta name="description" content="Zeehn Lingo — ingliz tilini bosqichma-bosqich, o'zbek tilida va o'yin kabi qiziqarli o'rganish platformasi.">
<meta name="theme-color" content="#0046E0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--topbg:rgba(243,247,255,.92);--off:#E8ECF6;--blue:#0046E0;--blue2:#2F6BFF;--sky:#E8F0FF;--bg:#F3F7FF;--ink:#0B1B4D;--muted:#5B6A8F;--line:#DCE5FA;--volt:#C6FF3D;--green:#1FB45A;--green-bg:#E3F9EA;--red:#E5484D;--red-bg:#FFE9EA;--coin:#FFB020;--coin-bg:#FFF4DB;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.hide{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--blue)}
.brand img{width:30px;height:30px}
.stats{display:flex;gap:6px}
.st{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;padding:6px 10px;border-radius:30px;background:var(--card);border:1px solid var(--line)}
.st svg{width:18px;height:18px}
.st.fire.on{color:#F2600C}
.st.fire.off{color:#9AA6C4}
main{flex:1;padding:16px 16px 110px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#8A96B6;padding:6px 0;border-radius:14px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue);background:var(--sky)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px -24px rgba(11,27,77,.35)}
h2.t{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:12px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 4px 0 #0035AD;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0035AD}
.btn:disabled{background:#C9D3EA;box-shadow:0 4px 0 #B3BFDA;color:#fff;cursor:default}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.green{background:var(--green);box-shadow:0 4px 0 #148A43}
.btn.red{background:var(--red);box-shadow:0 4px 0 #B8333A}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:30px;background:var(--sky);color:var(--blue)}
/* hero */
.hero{background:linear-gradient(135deg,#0046E0,#2F6BFF);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-size:13px;opacity:.85}
.hero h1{font-size:21px;font-weight:800;margin:2px 0 14px}
.track{position:relative;height:56px;margin:0 6px}
.track .ln{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:6px;background:rgba(255,255,255,.25)}
.track .fl{position:absolute;left:0;top:14px;height:6px;border-radius:6px;background:var(--volt)}
.track .dt{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--card);border:3px solid rgba(255,255,255,.4)}
.track .dt.ok{background:var(--volt);border-color:var(--volt)}
.track .dt.me{width:24px;height:24px;top:5px;margin-left:-12px;border:4px solid #fff;background:var(--volt);box-shadow:0 0 0 4px rgba(198,255,61,.35)}
.track .lb{position:absolute;top:34px;font-size:10px;font-weight:600;transform:translateX(-50%);opacity:.8;white-space:nowrap}
.track .lb.me{opacity:1;font-weight:800;color:var(--volt)}
.hero .nx{font-size:13px;margin-top:4px;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:12px;display:flex;justify-content:space-between;gap:8px}
.daily{display:flex;align-items:center;gap:12px;margin-top:12px}
.daily .ic{width:44px;height:44px;border-radius:14px;background:var(--coin-bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
/* map */
.unit{margin-top:22px}
.ub{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.ub small{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em}
.ub b{display:block;font-size:16px}
.ub .pr{font-size:12px;font-weight:700;color:var(--muted)}
.path{display:flex;flex-direction:column;align-items:center;gap:46px;padding:62px 0 34px;position:relative}
.node{position:relative;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;transition:transform .1s}
.node:active{transform:scale(.94)}
.node svg{width:32px;height:32px}
.node.done{background:var(--volt);color:var(--ink);box-shadow:0 6px 0 #9CD11E}
.node.cur{background:var(--blue);color:#fff;box-shadow:0 6px 0 #0035AD,0 0 0 8px rgba(0,70,224,.15);animation:pulse 1.8s infinite}
.node.lock{background:var(--off);color:#9AA6C4;box-shadow:0 6px 0 #CDD5E8}
.node.chest{border-radius:22px;background:var(--coin-bg);box-shadow:0 6px 0 #EBCB86}
.node.chest.open{background:var(--coin);box-shadow:0 6px 0 #C98200}
.node.chest.got{background:#F1F3F8;box-shadow:0 6px 0 #DDE2EE;opacity:.8}
.node .st2{position:absolute;bottom:-6px;right:-4px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.node .st2 svg{width:14px;height:14px}
.here{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--volt);font-size:12px;font-weight:800;padding:6px 12px;border-radius:12px;animation:bob 1.6s ease-in-out infinite}
.here:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.nlabel{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.here.r,.here.l{bottom:auto;top:50%;animation:none}
.here.r{left:86px;transform:translateY(-50%)}
.here.l{left:auto;right:86px;transform:translateY(-50%)}
.here.r:after{left:-6px;top:50%;bottom:auto;margin:-6px 0 0;border:6px solid transparent;border-right-color:var(--ink);border-left:0}
.here.l:after{left:auto;right:-6px;top:50%;bottom:auto;margin:-6px 0 0;border:6px solid transparent;border-left-color:var(--ink);border-right:0}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #0035AD,0 0 0 6px rgba(0,70,224,.18)}50%{box-shadow:0 6px 0 #0035AD,0 0 0 14px rgba(0,70,224,.06)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(11,27,77,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
/* toast */
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:14px;max-width:90%;text-align:center;animation:fade .2s}
/* lesson */
.full{position:fixed;inset:0;z-index:50;background:var(--card);display:flex;justify-content:center}
.full .in{width:100%;max-width:560px;display:flex;flex-direction:column;padding:14px 18px max(18px,env(safe-area-inset-bottom))}
.lh{display:flex;align-items:center;gap:12px;padding-top:env(safe-area-inset-top)}
.lh .x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#8A96B6}
.bar{flex:1;height:14px;border-radius:10px;background:var(--off);overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:var(--green);transition:width .3s}
.ex{flex:1;padding:22px 0 12px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.ex .q{font-size:20px;font-weight:800}
.ex .w{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:800;color:var(--blue)}
.spk{width:48px;height:48px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 0 #0035AD}
.spk svg{width:24px;height:24px}
.spk.big{width:110px;height:110px;border-radius:30px;margin:10px auto}
.spk.big svg{width:50px;height:50px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:15px 16px;border-radius:16px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:17px;background:var(--card)}
.opt.sel{border-color:var(--blue2);background:var(--sky);box-shadow:0 3px 0 #9FBBFF;color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:#147A3D;box-shadow:0 3px 0 #9FE0B6}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:#B8333A;box-shadow:0 3px 0 #F2A7AA}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{text-align:center;font-size:16px;padding:14px 8px}
.match .opt.gone{opacity:.35;border-color:var(--green);background:var(--green-bg);box-shadow:none}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px}
.tile{padding:10px 14px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:16px;background:var(--card)}
.tile.used{visibility:hidden}
.inp{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);font-size:18px;font-weight:600;outline:none;background:var(--bg)}
.inp:focus{border-color:var(--blue2);background:var(--card)}
.words{display:grid;gap:10px}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:16px}
.wrow b{font-size:18px;color:var(--blue)}
.wrow .spk{width:40px;height:40px;border-radius:12px}
.wrow .spk svg{width:20px;height:20px}
.fb{margin:0 -18px -18px;padding:16px 18px max(18px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
.fb.ok{background:var(--green-bg)}
.fb.bad{background:var(--red-bg)}
.fb h3{font-size:19px;font-weight:800;margin-bottom:2px}
.fb.ok h3{color:#147A3D}.fb.bad h3{color:#B8333A}
.fb p{font-size:15px;margin-bottom:12px}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.end .em{font-size:70px}
.end h2{font-size:26px;font-weight:800}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:10px 0}
.res div{border:2px solid var(--line);border-radius:16px;padding:10px 4px}
.res b{display:block;font-size:22px}
.res small{font-size:11px;font-weight:700;color:var(--muted)}
/* flashcard */
.fc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.fc .w{justify-content:center;font-size:38px}
.fc .tr{font-size:26px;font-weight:700;color:var(--green);min-height:40px}
/* lists */
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tiles3 div{border-radius:16px;padding:12px 10px}
.tiles3 b{display:block;font-size:24px;font-weight:800}
.tiles3 small{font-size:11px;font-weight:600}
.wl{display:grid;gap:8px;margin-top:14px}
.wi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.wi .tx{flex:1;min-width:0}
.wi b{display:block;font-size:15px}
.wi span{font-size:13px;color:var(--muted)}
.wi .sb{width:36px;height:36px;border-radius:12px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.wi .sb svg{width:18px;height:18px}
.lvl{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.lvl.l{background:var(--green-bg);color:#147A3D}.lvl.r{background:var(--coin-bg);color:#8A5300}.lvl.d{background:var(--red-bg);color:#B8333A}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.sys{align-self:center;background:var(--coin-bg);color:#8A5300;font-size:13px;text-align:center}
.qs{display:flex;gap:8px;flex-wrap:wrap}
.qs button{font-size:13px;font-weight:600;padding:8px 12px;border-radius:20px;background:var(--sky);color:var(--blue)}
.cin{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:10px 12px;background:var(--bg);display:flex;gap:8px;z-index:25}
.cin input{flex:1;padding:13px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);outline:none}
.cin button{width:50px;border-radius:16px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.cin button svg{width:22px;height:22px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9AA6C4;animation:dt 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.3}50%{opacity:1}}
/* rating */
.rme{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0046E0,#2F6BFF);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:12px}
.rme b{font-size:28px;font-weight:800}
.rl{display:grid;gap:8px}
.ri{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.ri .p{width:30px;font-weight:800;color:var(--muted);text-align:center}
.ri .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.ri .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .xp{font-weight:800;color:var(--blue)}
.ri.me{background:var(--sky);border-color:#9FBBFF}
/* profile */
.pf{text-align:center;padding:22px 16px}
.pf .av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background:var(--blue);color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--sky)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.grid2 .card{padding:14px}
.grid2 b{display:block;font-size:22px;font-weight:800}
.grid2 small{color:var(--muted);font-weight:600;font-size:12px}
.soon{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed #B9C6E6;border-radius:16px;background:var(--card)}
.soon .e{font-size:26px}
.soon b{display:block;font-size:15px}
/* auth */
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;max-width:440px;margin:0 auto}
.auth .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;white-space:nowrap;color:var(--blue);margin-bottom:8px}
.auth .lg img{width:46px;height:46px}
.auth h1{font-size:28px;font-weight:800;line-height:1.2;margin:14px 0 6px;letter-spacing:-.4px}
.auth h1 span{color:var(--blue)}
.tabs{display:flex;background:var(--off);border-radius:14px;padding:4px;margin:20px 0 14px}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--blue);box-shadow:0 2px 8px rgba(11,27,77,.08)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px;outline:none}
.fld input:focus{border-color:var(--blue2)}
.perks{display:grid;gap:8px;margin-top:18px}
.perks div{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500}
.perks i{font-style:normal;width:32px;height:32px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center}
.ferr{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin-bottom:8px}

#side{display:none}
.nbrand{display:none}
.navfoot{display:none}
@media (min-width:960px){
 .app{max-width:none;display:grid;grid-template-columns:270px minmax(0,1fr) 380px;grid-template-rows:auto 1fr;column-gap:40px;padding:0 36px 0 0}
 .top{grid-column:2/4;grid-row:1;background:transparent;backdrop-filter:none;border-bottom:0;padding:22px 0 14px}
 .top .brand{visibility:hidden}
 .st{font-size:15px;padding:8px 14px}
 main{grid-column:2;grid-row:2;padding:0 0 48px}
 #side{display:flex;flex-direction:column;gap:14px;grid-column:3;grid-row:2;position:sticky;top:88px;align-self:start;padding-bottom:40px}
 #side .daily{margin-top:0}
 .nav{left:0;top:0;bottom:0;transform:none;width:270px;max-width:none;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:26px 18px;background:var(--card)}
 .nav button:hover{background:var(--bg)}
 .nbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--blue);padding:4px 12px 26px}
 .nbrand img{width:40px;height:40px}
 .nav button{flex:none;flex-direction:row;gap:14px;font-size:16px;font-weight:700;padding:13px 16px;justify-content:flex-start;border-radius:16px}
 .nav button:hover{background:var(--card)}
 .nav button.on{background:var(--sky)}
 .nav button svg{width:26px;height:26px}
 .path{gap:54px}
 .node{width:86px;height:86px}
 .node svg{width:36px;height:36px}
 .here.r{left:98px}.here.l{right:98px}
 .nlabel{top:96px;font-size:13px}
 .ub{padding:16px 20px}.ub b{font-size:18px}
 .wl{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:repeat(3,1fr)}
 .chat{padding-bottom:20px}
 .cin{position:sticky;bottom:20px;left:auto;transform:none;width:100%;max-width:none;padding:0;background:transparent;margin-top:16px}
 h2.t{font-size:28px}
 .sidecard h4{font-size:15px;font-weight:800;margin-bottom:10px}
 .ex .q{font-size:24px}
 .full .in{max-width:760px;padding-top:30px}
}

async function api(path, data) {
  const opt = data === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) };
  let r;
  try { r = await fetch("/api/l/" + path, { credentials: "same-origin", ...opt }); }
  catch { return { ok: false, error: "Internet bilan aloqa yo'q" }; }

  if (r.status === 401 && j.error === "auth") { S.me = null; renderAuth(); }
  return j;
}

  if (!canSpeak) return;

}

}

  const n = tiers.length - 1;
  const pos = (i) => (i / n) * 100;
  let fill = pos(tier.index);
  if (tier.next) fill += (tier.done / Math.max(1, tier.total)) * (100 / n);
  return `<div class="track"><div class="ln"></div><div class="fl" style="width:${Math.min(100, fill)}%"></div>
    ${tiers.map((t, i) => `<div class="dt ${i < tier.index ? "ok" : ""} ${i === tier.index ? "me" : ""}" style="left:${pos(i)}%"></div>
    <div class="lb ${i === tier.index ? "me" : ""}" style="left:${Math.min(94, Math.max(6, pos(i)))}%">${esc(t.name)}</div>`).join("")}</div>`;
}

const STK = [
  ["👋", "💬", "🔢", "📅", "🌈", "😊", "⭐"],
  ["✏️", "🎒", "🧸", "⚽", "👀", "✋", "📚"],
  ["👩‍🏫", "🌳", "🌸", "👨‍👩‍👧", "👵", "🛝", "🩺"],
  ["👕", "🧦", "🏠", "🍳", "🥪", "🍎", "🧃"],
  ["🧑‍🤝‍🧑", "🔺", "🦁", "🐒", "🦒", "🥕", "🐟"],

];
function decorateMap() {
  document.querySelectorAll("#main .unit").forEach((unit, ui) => {
    const path = unit.querySelector(".path");
    if (!path) return;
    path.querySelectorAll(".road,.stk").forEach((x) => x.remove());
    const pr = path.getBoundingClientRect();
    const W = path.clientWidth, H = path.clientHeight;
    const pts = [...path.querySelectorAll(".node")].map((n) => {
      const r = n.getBoundingClientRect();
      return { x: r.left - pr.left + r.width / 2, y: r.top - pr.top + r.height / 2, r: r.width / 2, cur: n.classList.contains("cur") };
    });
    if (!pts.length) return;
    let d = `M ${W / 2} 0 C ${W / 2} ${pts[0].y / 2}, ${pts[0].x} ${pts[0].y / 2}, ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], my = (a.y + b.y) / 2;
      d += ` C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`;
    }
    const last = pts[pts.length - 1];
    d += ` C ${last.x} ${(last.y + H) / 2}, ${W / 2} ${(last.y + H) / 2}, ${W / 2} ${H}`;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "road"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = `<path d="${d}" class="rd1"/><path d="${d}" class="rd2"/>`;
    path.prepend(svg);
    const icons = STK[ui % STK.length];
    const sz = W > 700 ? 84 : W > 500 ? 70 : 54;
    pts.forEach((p, i) => {
      const dx = p.x - W / 2;
      const side = Math.abs(dx) < 10 ? (i % 2 ? -1 : 1) : dx > 0 ? -1 : 1;
      const reach = Math.min(W / 2 - sz / 2 - 12, Math.max(p.r + sz, W * 0.3));
      const x = W / 2 + side * reach;
      if (p.cur || Math.abs(x - p.x) < p.r + sz / 2 + 8) return;
      const st = document.createElement("span");
      st.className = "stk"; st.setAttribute("aria-hidden", "true");
      st.textContent = icons[i % icons.length];
      st.style.cssText = `left:${x - sz / 2}px;top:${p.y - sz / 2 + (i % 2 ? 14 : -14)}px;width:${sz}px;height:${sz}px;font-size:${sz * 0.5}px;animation-delay:${(i % 4) * 0.6}s`;
      path.appendChild(st);
    });
  });
}

function buildExercises(l) {
  const all = lessons(), idx = all.findIndex((x) => x.id === l.id);
  const pool = all.slice(0, Math.max(idx + 1, 3)).flatMap((x) => x.words);
  const others = (w, k) => pick(pool.filter((p) => p[k] !== w[k]), 3).map((p) => p[k]);
  const W = l.words;
  const ex = [{ t: "intro" }];
  const practice = [];
  shuffle(W).forEach((w, i) => {
    if (i % 2 === 0 || !canSpeak) practice.push({ t: "mcq", q: "Tarjimasini tanlang", word: w[0], speak: w[0], opts: shuffle([w[1], ...others(w, 1)]), ans: w[1] });
    else practice.push({ t: "listen", q: "Eshiting va tarjimasini tanlang", speak: w[0], opts: shuffle([w[1], ...others(w, 1)]), ans: w[1], word: w[0] });
  });
  pick(W, 2).forEach((w) => practice.push({ t: "mcq", q: "Inglizchasini tanlang", word: w[1], opts: shuffle([w[0], ...others(w, 0)]), ans: w[0], speakAns: true }));
  const singles = pool.filter((p) => !/\s/.test(p[0])).map((p) => p[0]);
  l.sentences.forEach((s) => {
    const toks = s[0].replace(/[.,!?]/g, "").split(/\s+/);
    const extra = pick(singles.filter((x) => !toks.map(norm).includes(norm(x))), 2);
    practice.push({ t: "build", q: "Gapni inglizchaga tarjima qiling", uz: s[1], ans: toks.join(" "), full: s[0], tiles: shuffle([...toks, ...extra]) });
  });
  const tw = pick(W, 1)[0];
  practice.push({ t: "type", q: "Inglizchasini yozing", uz: tw[1], ans: tw[0] });
  const pr = shuffle(practice);
  pr.splice(Math.floor(pr.length / 2), 0, { t: "match", q: "Juftliklarni toping", pairs: W });
  return ex.concat(pr);
}

      <div class="ans" id="an"></div><div class="bank">${e.tiles.map((t, i) => `<button class="tile" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
    const draw = () => {

function grade(L, e, answer) {
  let ok, right;
  if (e.t === "match") { ok = answer === "ok"; right = ""; }
  else if (e.t === "type") { ok = norm(answer) === norm(e.ans); right = e.ans; }
  else if (e.t === "build") { ok = norm(answer) === norm(e.ans); right = e.full; }
  else { ok = answer === e.ans; right = e.ans; }
  const key = L.i;
  if (!e.retry) { L.graded++; if (ok) L.firstOk++; }
  haptic(ok);
  if (e.t === "mcq" || e.t === "listen") {
    $("#ex").querySelectorAll(".opt").forEach((b) => { b.disabled = true; if (b.dataset.v === e.ans) b.classList.add("ok"); else if (b.classList.contains("sel")) b.classList.add("bad"); });
  }
  if (!ok && !e.retry && e.t !== "match") L.list.push({ ...e, retry: true });
  if (ok && (e.t === "build" || e.t === "type")) say(e.full || e.ans);
  if (e.t === "listen" && !ok) say(e.speak);
  const praise = ["Barakalla! 🎉", "Zo'r! ⭐", "To'g'ri! 👏", "Ajoyib! 🔥"];
  $("#lf").innerHTML = `<div class="fb ${ok ? "ok" : "bad"}">
    <h3>${ok ? praise[Math.floor(Math.random() * praise.length)] : e.t === "match" ? "Yaxshi, lekin xatolar bor edi" : "Noto'g'ri"}</h3>
    ${!ok && right ? `<p>To'g'ri javob: <b>${esc(right)}</b>${e.word && e.t === "listen" ? ` (${esc(e.word)})` : ""}</p>` : `<p>${e.t === "build" && ok ? esc(e.full) : "&nbsp;"}</p>`}
    <button class="btn ${ok ? "green" : "red"}" id="nx">Davom etish</button></div>`;
  $("#nx").onclick = () => { L.i = key + 1; showEx(L); };
  $("#nx").focus();
}

function learned() {
  const ls = lessons().filter((l) => S.me.done[l.id]);
  return { words: ls.flatMap((l) => l.words), sentences: ls.flatMap((l) => l.sentences) };
}
function buildPractice(kind) {
  const { words, sentences } = learned();
  const pool = words.length >= 4 ? words : lessons().slice(0, 3).flatMap((l) => l.words);
  const others = (w, k) => pick(pool.filter((p) => p[k] !== w[k]), 3).map((p) => p[k]);
  const singles = pool.filter((p) => !/\s/.test(p[0])).map((p) => p[0]);
  if (kind === "listen") return pick(words, 8).map((w) => canSpeak
    ? { t: "listen", q: "Eshiting va tarjimasini tanlang", speak: w[0], word: w[0], opts: shuffle([w[1], ...others(w, 1)]), ans: w[1] }
    : { t: "mcq", q: "Tarjimasini tanlang", word: w[0], opts: shuffle([w[1], ...others(w, 1)]), ans: w[1] });
  if (kind === "build") return pick(sentences, 6).map((s) => {
    const toks = s[0].replace(/[.,!?]/g, "").split(/\s+/);
    return { t: "build", q: "Gapni inglizchaga tarjima qiling", uz: s[1], ans: toks.join(" "), full: s[0], tiles: shuffle([...toks, ...pick(singles.filter((x) => !toks.map(norm).includes(norm(x))), 2)]) };
  });
  return pick(words, 10).map((w, i) => i % 3 === 2
    ? { t: "type", q: "Inglizchasini yozing", uz: w[1], ans: w[0] }
    : i % 3 === 1 ? { t: "mcq", q: "Inglizchasini tanlang", word: w[1], opts: shuffle([w[0], ...others(w, 0)]), ans: w[0], speakAns: true }

/* ---------- Ovoz (Speech-to-Text) ---------- */
function listenOnce(lang, onText, btn, onInterim) {
  if (!SR) { toast("Brauzeringiz ovozni tanimaydi. Chrome'da oching"); return null; }
  const r = new SR();
  r.lang = lang; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let final = "", alts = [];
  if (btn) btn.classList.add("rec");
  r.onresult = (e) => {
    let txt = "";
    for (let i = 0; i < e.results.length; i++) {
      txt += e.results[i][0].transcript;
      if (e.results[i].isFinal) alts = [...e.results[i]].map((a) => a.transcript);
    }
    final = txt;
    if (onInterim) onInterim(txt);
  };
  r.onerror = (e) => { if (btn) btn.classList.remove("rec"); if (e.error === "not-allowed") toast("Mikrofonga ruxsat bering 🎙", 3000); else if (e.error === "no-speech") toast("Ovoz eshitilmadi, qayta urinib ko'ring"); };

function startTalk(id) {
  if (!SR) { toast("Brauzeringiz ovozni tanimaydi. Chrome'da oching", 3000); return; }
  const topic = TALKS.find((t) => t.id === id);
  const T = { topic, i: 0, ok: 0, tries: 0, log: [], free: !topic, msgs: [], start: Date.now(), busy: false };
  const d = document.createElement("div");
  d.className = "full vfull";
  d.innerHTML = `<div class="in">
    <div class="lh" style="color:#fff"><button class="x" id="vx" style="color:#fff">${IC.x}</button><b style="flex:1">${topic ? topic.e + " " + topic.t : "🗣 Erkin suhbat"}</b><span class="vtime" id="vt">00:00</span></div>

    <div class="vbar"><button class="vbtn" id="vhint">💡</button><button class="vmic" id="vmic" aria-label="Gapirish">🎙</button><button class="vbtn" id="vskip">⏭</button></div>
    <p class="vsub" id="vsub">AI gapirmoqda…</p></div>`;
  document.body.appendChild(d); document.body.style.overflow = "hidden";
  const timer = setInterval(() => { const s = Math.floor((Date.now() - T.start) / 1000); $("#vt").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  const close = () => { clearInterval(timer); if (canSpeak) speechSynthesis.cancel(); if (T.rec) try { T.rec.abort(); } catch {} closeFull(); };
  $("#vx").onclick = () => { if (T.log.length > 1 && !T.done) finish(); else close(); };
  const log = (who, text, extra = "") => {
    T.log.push({ who, text });
    $("#vlog").insertAdjacentHTML("beforeend", `<div class="vb ${who}">${esc(text)}${extra}</div>`);
    $("#vlog").scrollTop = 1e6;
  };
  const speak = (text, after) => {
    $("#vav").classList.add("talk"); $("#vsub").textContent = "AI gapirmoqda…"; $("#vmic").disabled = true;
    if (!canSpeak) { $("#vav").classList.remove("talk"); $("#vmic").disabled = false; after && after(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; if (voice) u.voice = voice; u.rate = 0.88;
    u.onend = u.onerror = () => { $("#vav").classList.remove("talk"); $("#vmic").disabled = false; $("#vsub").textContent = "Mikrofonni bosing va gapiring"; after && after(); };
    speechSynthesis.speak(u);
  };
  const aiLine = () => {
    const L = topic.lines[T.i];
    log("ai", L[0], `<span class="vuz">${esc(L[1])}</span>`);
    speak(L[0]);
  };
  const next = () => { T.i++; T.tries = 0; if (T.i >= topic.lines.length) return finish(); setTimeout(aiLine, 500); };
  $("#vhint").onclick = () => {
    if (T.free) return toast("Masalan: \"Tell me about your day\" yoki \"Let's talk about food\"", 3500);
    const L = topic.lines[Math.min(T.i, topic.lines.length - 1)];
    toast(`💡 Masalan: "${L[3]}"`, 3500); say(L[3], true);
  };
  $("#vskip").onclick = () => { if (T.free) return; if (T.busy) return; log("tip", `O'tkazib yuborildi. Namuna: "${topic.lines[T.i][3]}"`); next(); };
  $("#vmic").onclick = () => {
    if (T.busy) return;
    if (canSpeak) speechSynthesis.cancel();
    $("#vsub").textContent = "Eshityapman… gapiring";
    $("#vint").textContent = "";
    d.classList.add("listening");
    T.rec = listenOnce("en-US", async (text, alts) => {
      d.classList.remove("listening"); $("#vint").textContent = "";
      log("me", text);
      if (T.free) return freeReply(text);
      const L = topic.lines[T.i];
      if (talkOk([text, ...(alts || [])], L[2])) {
        T.ok += T.tries === 0 ? 1 : 0.5;
        log("good", ["👍 Zo'r!", "🎉 Barakalla!", "✅ To'g'ri!", "🔥 Ajoyib!"][T.i % 4]);
        next();
      } else {
        T.tries++;
        log("tip", T.tries >= 2 ? `Hechqisi yo'q! Shunday desa bo'ladi: "${L[3]}"` : `🤔 Tushunmadim. Yana urinib ko'ring. Masalan: "${L[3]}"`);
        if (T.tries >= 2) next(); else say(L[3], true);
      }

  };
  async function freeReply(text) {
    T.busy = true; $("#vsub").textContent = "AI o'ylayapti…"; $("#vav").classList.add("think");

    const r = await api("ai", { messages: T.msgs, mode: "voice" });

    if (!r.ok) { log("tip", r.error || "AI javob bermadi"); $("#vsub").textContent = "Mikrofonni bosing va gapiring"; return; }
    const parts = r.text.split(/\n+/); const tip = parts.filter((x) => /^tip:/i.test(x.trim())).join(" ");

  }

    <div class="okp2">${pic(rv, 92)}<b>${esc(rv.name)}</b><small>${solo ? "O'yindan keyin havolani yuborasiz" : rv.bot ? "Hozircha raqib yo'q — bot bilan" : r.friend ? "Do'stingiz" : "Raqib"}</small></div></div>`;
  await new Promise((ok) => setTimeout(ok, 1900));
  const ans = [], pts = (a) => (a.c ? 100 + Math.max(0, Math.round((10000 - Math.min(10000, a.ms)) / 100)) : 0);
  let my = 0, op = 0, i = 0, t0 = 0, tick = null, oppT = null, locked = false;
  d.querySelector(".in").innerHTML = `
    <div class="okbar"><button class="x" id="okx" style="color:#fff">${IC.x}</button>
      <div class="oksc"><span class="okme">${pic(me, 34)}<b id="sm">0</b></span><span class="okqn" id="qn">1/${N}</span><span class="okop"><b id="so">0</b>${pic(rv, 34)}</span></div></div>
    <div class="oktm"><div id="tb"></div></div>
    <div class="okdots"><div id="dm"></div><div id="do"></div></div>
    <div class="okq"><small id="qd"></small><h2 id="qq"></h2><div class="okopp" id="oa"></div></div>
    <div class="okops" id="qo"></div>`;
  const dots = () => {
    $("#dm").innerHTML = Q.map((_, k) => `<i class="${k < ans.length ? (ans[k].c ? "g" : "r") : k === i ? "c" : ""}"></i>`).join("");
    $("#do").innerHTML = solo ? "" : Q.map((_, k) => `<i class="${k < i || (k === i && $("#oa").dataset.done) ? (r.opp[k].c ? "g" : "r") : ""}"></i>`).join("");
  };
  $("#okx").onclick = () => { if (confirm("Bellashuvdan chiqasizmi? Bu mag'lubiyat hisoblanadi.")) { clearInterval(tick); clearTimeout(oppT); while (ans.length < N) ans.push({ a: null, ms: LIM }); finish(true); } };
  const show = () => {
    locked = false; const q = Q[i];
    $("#qn").textContent = `${i + 1}/${N}`;
    $("#qd").textContent = q.dir === "en-uz" ? "🇬🇧 → 🇺🇿 Tarjimasini toping" : "🇺🇿 → 🇬🇧 Inglizchasini toping";
    $("#qq").textContent = q.q;
    $("#oa").textContent = `${rv.name} o'ylayapti…`; delete $("#oa").dataset.done; $("#oa").className = "okopp"; $("#oa").style.visibility = solo ? "hidden" : "";
    $("#qo").innerHTML = q.opts.map((o) => `<button class="opt">${esc(o)}</button>`).join("");
    $("#qo").querySelectorAll(".opt").forEach((b) => (b.onclick = () => answer(b.textContent, b)));
    if (q.dir === "en-uz") say(q.q);
    dots(); t0 = Date.now();
    const oa = r.opp[i];
    if (oa) oppT = setTimeout(() => { $("#oa").dataset.done = 1; $("#oa").textContent = `${rv.name} javob berdi`; $("#oa").className = "okopp done"; dots(); }, Math.min(LIM, oa.ms));
    clearInterval(tick);
    tick = setInterval(() => { const e = Date.now() - t0; $("#tb").style.width = Math.max(0, 100 - (e / LIM) * 100) + "%"; $("#tb").className = e > LIM * 0.7 ? "hot" : ""; if (e >= LIM) answer(null, null); }, 100);
  };
  const answer = (a, btn) => {
    if (locked) return; locked = true; clearInterval(tick); clearTimeout(oppT);
    const ms = Math.min(LIM, Date.now() - t0), q = Q[i], c = a != null && a === q.answer ? 1 : 0;
    ans.push({ a, ms }); my += pts({ c, ms }); if (!solo) op += pts(r.opp[i]);
    haptic(c);
    $("#qo").querySelectorAll(".opt").forEach((b) => { b.disabled = true; if (b.textContent === q.answer) b.classList.add("ok"); else if (b === btn) b.classList.add("bad"); });
    if (!solo) $("#oa").dataset.done = 1;
    if (!solo) { $("#oa").textContent = r.opp[i].c ? `${rv.name}: to'g'ri ✓` : `${rv.name}: xato ✗`; $("#oa").className = "okopp done " + (r.opp[i].c ? "g" : "r"); }
    $("#sm").textContent = my; $("#so").textContent = solo ? "?" : op; dots();
    setTimeout(() => { i++; i < N ? show() : finish(false); }, c ? 900 : 1500);
  };
  async function finish(quit) {
    const f = await api("oktagon/finish", { id: r.id, answers: ans });
    const myT = ans.reduce((t, a) => t + a.ms, 0), opT = r.opp.reduce((t, a) => t + Math.min(LIM, a.ms), 0);
    const mmss = (ms) => { const x = Math.round(ms / 1000); return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, "0")}`; };
    if (!f.ok) { closeFull(); toast(f.error || "Xatolik"); return; }
    if (f.challenge) {
      const sh = shareLink(f.url, `⚔️ Men Zeehn Lingo Oktagonida ${f.score} ball oldim! Meni yuta olasanmi?`);
      d.querySelector(".in").innerHTML = `<div class="end" style="color:#fff"><div class="em">📨</div><h2>Natijangiz: ${f.score} ball</h2>
        <p style="opacity:.85">${f.correct}/${N} to'g'ri · ⏱ ${mmss(myT)}. Endi havolani do'stingizga yuboring — u xuddi shu savollarga javob beradi. Natija «Oktagon» bo'limida chiqadi.</p>
        <div class="lnk" style="max-width:360px;width:100%;background:rgba(255,255,255,.12);color:#fff">${esc(f.url)}</div>
        <a class="btn tgb" href="${esc(sh.tg)}" target="_blank" rel="noopener" style="max-width:360px">✈️ Telegram orqali yuborish</a>
        <button class="btn ghost" id="okcp" style="max-width:360px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">📋 Havolani nusxalash</button>
        <button class="btn ghost" id="okc" style="max-width:360px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Yopish</button></div>`;
      $("#okcp").onclick = sh.copy; $("#okc").onclick = () => { closeFull(); refresh(); };
      return;
    }
    const big = { win: ["🏆", "G'alaba!", "Zo'r o'ynadingiz!"], lose: ["💪", "Mag'lubiyat", quit ? "Bellashuvni tark etdingiz" : "Keyingi safar albatta yutasiz!"], draw: ["🤝", "Durrang!", "Kuchlar teng keldi"] }[f.result];
    d.querySelector(".in").innerHTML = `<div class="end" style="color:#fff"><div class="em">${big[0]}</div><h2>${big[1]}</h2><p style="opacity:.85">${big[2]}</p>
      <div class="okfin"><div>${pic(me, 56)}<b>${f.score}</b><small>${f.correct}/${N} to'g'ri</small><small class="oktime">⏱ ${mmss(myT)}</small></div><span>:</span><div>${pic(rv, 56)}<b>${f.oppScore}</b><small>${f.oppCorrect}/${N} to'g'ri</small><small class="oktime">⏱ ${mmss(opT)}</small></div></div>
      <div class="res okres2"><div><b style="color:#FFC768">+${f.coins}</b><small>COIN</small></div><div><b>${mmss(myT)}</b><small>VAQTINGIZ</small></div><div><b>${(myT / N / 1000).toFixed(1)}s</b><small>O'RTACHA</small></div></div>
      ${f.coins ? "" : `<p style="opacity:.75;font-size:13px">Bugungi 10 ta coinli o'yin tugadi</p>`}
      ${r.friend ? `<p style="opacity:.85;font-size:13px">Natija ${esc(rv.name)}ga ham ko'rinadi va u ham coin oladi</p>` : ""}
      <button class="btn" id="oka" style="max-width:360px;background:#C6FF3D;color:#0B1B4D;box-shadow:0 4px 0 #8DBF1F">⚡ Yana o'ynash</button>
      <button class="btn ghost" id="okc" style="max-width:360px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Yopish</button></div>`;
    $("#oka").onclick = () => { closeFull(); loadMe().then(() => { renderApp(); startDuel(r.friend ? { challenge: true } : {}); }); };
    if (r.friend) $("#oka").textContent = "👥 Men ham do'stimni chaqiraman";
    $("#okc").onclick = () => { closeFull(); refresh(); };
  }
  show();
}

function editProfile() {
  const m = S.me;
  const d = document.createElement("div");
  d.className = "dim";
  d.innerHTML = `<div class="sheet edsh">
    <h2 class="t" style="margin-bottom:14px">Profilni tahrirlash</h2>

    <div class="edsep"></div>

    <form id="pf">
      ${pwField("old", "Joriy parol", "current-password")}
      ${pwField("new", "Yangi parol", "new-password")}
      ${pwField("new2", "Yangi parolni takrorlang", "new-password")}
      <p class="ferr" id="pfe"></p>
      <button class="btn" type="submit">Parolni yangilash</button>
    </form>
    <button class="btn ghost" id="ecl" style="margin-top:12px">Yopish</button></div>`;
  document.body.appendChild(d);
  d.onclick = (e) => { if (e.target === d) d.remove(); };
  $("#ecl", d).onclick = () => d.remove();
  d.querySelectorAll(".eye").forEach((b) => (b.onclick = () => {
    const i = b.previousElementSibling, show = i.type === "password";
    i.type = show ? "text" : "password"; b.innerHTML = show ? IC.eyeOff : IC.eye;
  }));
  $("#nf", d).onsubmit = async (e) => {
    e.preventDefault();
    const name = e.target.name.value.trim();
    const r = await api("profile", { name });
    if (!r.ok) { $("#nfe", d).textContent = r.error; return; }
    d.remove(); toast("Ism saqlandi ✓"); refresh();
  };
  $("#pf", d).onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, er = $("#pfe", d);
    if (f.new.value.length < 6) { er.textContent = "Yangi parol kamida 6 ta belgi bo'lsin"; return; }
    if (f.new.value !== f.new2.value) { er.textContent = "Yangi parollar bir xil emas"; return; }
    const r = await api("password", { old: f.old.value, new: f.new.value });
    if (!r.ok) { er.textContent = r.error; return; }
    d.remove(); toast("Parol yangilandi ✓ Boshqa qurilmalardan chiqildi", 3000);
  };
}

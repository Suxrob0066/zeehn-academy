<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeehn Platforma</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0046E0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0046E0;--blue2:#1E5BF0;--volt:#C6FF3D;--navy:#020B3A;--cloud:#EEF3FF;--line:#E2E8F5;--muted:#6B7594;--ok:#14A44D;--okbg:#E5F7EC;--warn:#D98A00;--warnbg:#FFF4DC;--bad:#E0323C;--badbg:#FDE8EA;--gray:#8A93AD;--graybg:#EEF0F5;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--cloud);color:var(--navy);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-art{background:radial-gradient(120% 80% at 20% 20%,#1E5BF0,#0046E0 50%,#0036B8);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art .bgz{position:absolute;right:-120px;bottom:-140px;width:560px;opacity:.08}
.login-art h1{font-size:44px;line-height:1.15;font-weight:700;max-width:520px}
.login-art h1 b{color:var(--volt);font-weight:700}
.login-art p{opacity:.85;margin-top:16px;max-width:440px;line-height:1.7}
.login-art .pts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.login-art .pts span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:999px;font-size:13px}
.login-box{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:26px;font-weight:700}
.login-card .sub{color:var(--muted);margin:6px 0 28px}
.login-logo-m{display:none;height:38px;margin-bottom:28px}

/* Layout */
.app{display:flex;min-height:100%}
.side{width:248px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40}
.side .logo{height:34px;margin:4px 10px 26px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#4A5373;font-weight:500;margin-bottom:3px;position:relative}
.nav a:hover{background:var(--cloud);color:var(--navy)}
.nav a.on{background:var(--blue);color:#fff;box-shadow:0 10px 24px -12px rgba(0,70,224,.8)}
.nav a .cnt{margin-left:auto;background:var(--volt);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.nav .sep{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin:18px 14px 8px}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;display:flex;align-items:center;gap:10px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--cloud);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.me .nm{font-weight:600;font-size:13px;line-height:1.2}
.me .rl{font-size:12px;color:var(--muted)}
.me button{margin-left:auto;color:var(--muted);padding:6px;border-radius:8px}
.me button:hover{background:var(--badbg);color:var(--bad)}
.main{flex:1;margin-left:248px;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:22px 32px 6px}
.top h1{font-size:24px;font-weight:700}
.top .sub{color:var(--muted);font-size:13px}
.top .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.burger{display:none;width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center}
.page{padding:18px 32px 60px}
.scrim{display:none}

/* UI */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--blue);color:#fff;white-space:nowrap;transition:.15s}
.btn:hover{background:#003BC0}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn.volt{background:var(--volt);color:var(--navy)}
.btn.volt:hover{background:#B5F01F}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.danger:hover{background:#F9D3D7}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:20px}
.card h3{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--blue);font-weight:500}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start;cursor:default}
a.stat{cursor:pointer}a.stat:hover{border-color:var(--blue)}
.stat .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.stat .v{font-size:24px;font-weight:700;line-height:1.1}
.stat .v.money{font-size:18px;padding-top:4px}
.stat>div:last-child{min-width:0}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:3px}
.stat.hero{background:linear-gradient(135deg,#0046E0,#1E5BF0);color:#fff;border:0}
.stat.hero .l{color:rgba(255,255,255,.8)}
.stat.hero .ic{background:rgba(255,255,255,.15)!important;color:#fff!important}
.ic.b{background:#E6EEFF;color:var(--blue)}.ic.g{background:var(--okbg);color:var(--ok)}.ic.r{background:var(--badbg);color:var(--bad)}.ic.y{background:var(--warnbg);color:var(--warn)}.ic.v{background:#F3FFD6;color:#5C8A00}
.bar{height:8px;background:var(--cloud);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--volt);border-radius:99px}
.stat:not(.hero) .bar i{background:var(--blue)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp,.sel{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none;min-width:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,70,224,.1)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .inp{width:100%;padding-left:40px}
.search svg{position:absolute;left:13px;top:11px;color:var(--gray)}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;min-height:80px}

.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:12px 16px;background:#F8FAFF;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F8FAFF}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-weight:600}
.who .sm{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-gray{background:var(--graybg);color:var(--gray)}.b-blue{background:#E6EEFF;color:var(--blue)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;background:var(--cloud);font-size:12px;font-weight:500;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{width:42px;height:42px;color:#B8C3E0;margin-bottom:8px}
.muted{color:var(--muted)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.row-acts{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:#fff}
.icon-btn:hover{color:var(--blue);border-color:var(--blue)}
.icon-btn.del:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn svg{width:17px;height:17px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ccard .stripe{position:absolute;left:0;top:0;bottom:0;width:5px}
.ccard h4{font-size:16px;font-weight:600}
.ccard .meta{color:var(--muted);font-size:13px;margin-top:4px}
.ccard .nums{display:flex;gap:18px;margin:16px 0}
.ccard .nums b{display:block;font-size:20px}
.ccard .nums span{font-size:12px;color:var(--muted)}
.ccard .foot{display:flex;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.ccard.off{opacity:.6}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days span{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--cloud);color:var(--muted)}
.days span.on{background:var(--blue);color:#fff}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600}
.list-item .s{font-size:12.5px;color:var(--muted)}
.cbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cbar .nm{width:140px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .tr{flex:1;height:10px;background:var(--cloud);border-radius:99px;overflow:hidden}
.cbar .tr i{display:block;height:100%;border-radius:99px}
.cbar .n{width:36px;text-align:right;font-weight:600}

/* Davomat */
.att-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.att-sum{display:flex;gap:8px;flex-wrap:wrap}
.att-list{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.att-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .n{width:26px;color:var(--gray);font-size:12px;text-align:right}
.att-row .grow{flex:1;min-width:0}
.att-row .nm{font-weight:600}
.att-row .ph{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--cloud);border-radius:12px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button:hover{background:#fff}
.seg button.on.keldi{background:var(--ok);color:#fff}
.seg button.on.kechikdi{background:var(--warn);color:#fff}
.seg button.on.kelmadi{background:var(--bad);color:#fff}
.seg button.on.sababli{background:var(--gray);color:#fff}
.savebar{position:sticky;bottom:16px;margin-top:16px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px -20px rgba(2,11,58,.7)}
.savebar .grow{flex:1}
.mx{border-collapse:separate;border-spacing:0;min-width:0}
.mx th,.mx td{padding:6px;text-align:center;font-size:12px;border-bottom:1px solid var(--line)}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:170px;padding-left:16px;z-index:1}
.mx th:first-child{background:#F8FAFF}
.mx .c{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.c.keldi{background:var(--okbg);color:var(--ok)}.c.kelmadi{background:var(--badbg);color:var(--bad)}.c.kechikdi{background:var(--warnbg);color:var(--warn)}.c.sababli{background:var(--graybg);color:var(--gray)}
.mx .pct{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}

/* Tabs */
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--cloud);color:var(--blue)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,11,58,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;box-shadow:0 40px 80px -30px rgba(2,11,58,.6);animation:pop .18s}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;font-weight:700}
.modal-h .x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-h .x:hover{background:var(--cloud)}
.modal-b{padding:22px 24px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:#4A5373}
.f .inp,.f .sel{width:100%}
.f .hint{font-size:12px;color:var(--muted)}
.pw{display:flex;gap:8px}.pw .inp{flex:1}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.daypick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--navy)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-grid div{background:var(--cloud);border-radius:12px;padding:12px 14px}
.info-grid span{display:block;font-size:12px;color:var(--muted)}
.info-grid b{font-weight:600}
.cred{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-top:6px}
.cred div{display:flex;justify-content:space-between;padding:6px 0;font-family:ui-monospace,monospace;font-size:15px}
.cred span{color:rgba(255,255,255,.6);font-family:'Poppins';font-size:13px}
.err{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:200;font-weight:500;box-shadow:0 20px 40px -20px rgba(2,11,58,.8);display:flex;gap:10px;align-items:center;animation:pop .2s}
.toast.bad{background:var(--bad)}
.loading{display:flex;justify-content:center;padding:60px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.today-card{background:linear-gradient(135deg,#0046E0,#1E5BF0);color:#fff;border-radius:18px;padding:22px;position:relative;overflow:hidden}
.today-card .bgz{position:absolute;right:-40px;top:-30px;width:200px;opacity:.1}
.lesson{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.lesson .tm{width:64px;text-align:center;font-weight:700;font-size:16px;color:var(--blue)}
.lesson .tm small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.lesson .grow{flex:1;min-width:0}
.lesson .t{font-weight:600}
.lesson .s{font-size:12.5px;color:var(--muted)}

@media (max-width:1100px){.g2{grid-template-columns:1fr}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}.login-art{display:none}.login-logo-m{display:block}
  .side{transform:translateX(-100%);transition:.25s;box-shadow:20px 0 60px -20px rgba(2,11,58,.4)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(2,11,58,.35);z-index:30}
  .main{margin-left:0}
  .burger{display:flex}
  .top{padding:16px 16px 4px;flex-wrap:wrap}
  .top h1{font-size:20px}
  .top .acts{width:100%;margin-left:0}
  .page{padding:12px 16px 90px}
  .form,.info-grid{grid-template-columns:1fr}
  .att-row{flex-wrap:wrap}
  .att-row .seg{width:100%}
  .att-row .seg button{flex:1;justify-content:center;padding:0 4px}
  .search{max-width:none}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:20px 20px 0 0;max-height:92vh;overflow:auto}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:14px;flex-direction:column;gap:10px}
  .stat .v{font-size:20px}
}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spin"></div></div></div>

<script>
// ===== Yordamchi funksiyalar =====
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (Number(n) || 0).toLocaleString("ru-RU").replace(/,/g, " ") + " so'm";
const num = (n) => (Number(n) || 0).toLocaleString("ru-RU");
const OYLAR = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
const KUNLAR = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"];
const KUNLAR_TOLIQ = ["Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba", "Yakshanba"];
const fmtDate = (d) => { if (!d) return "—"; const [y, m, dd] = d.slice(0, 10).split("-"); return `${+dd} ${OYLAR[+m - 1].toLowerCase()} ${y}`; };
const fmtMonth = (m) => { const [y, mm] = m.split("-"); return `${OYLAR[+mm - 1]} ${y}`; };
const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const addMonth = (m, k) => { let [y, mm] = m.split("-").map(Number); mm += k; while (mm > 12) { mm -= 12; y++; } while (mm < 1) { mm += 12; y--; } return `${y}-${String(mm).padStart(2, "0")}`; };
const dowOf = (d) => ((new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7) + 1;

// ===== API =====
async function api(path, opts = {}) {
  const o = { method: opts.method || "GET", headers: {}, credentials: "same-origin" };
  if (opts.body !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.body); }
  let r;
  try { r = await fetch("/api/p/" + path, o); } catch { throw new Error("Internet aloqasini tekshiring"); }
  let d = {};
  try { d = await r.json(); } catch {}
  if (r.status === 401 && path !== "login") { state.me = null; renderLogin(); throw new Error("Qaytadan kiring"); }
  if (!r.ok || d.ok === false) throw new Error(d.error || "Xatolik yuz berdi");
  return d;
}

function toast(msg, bad) {
  $$(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = (bad ? ic("alert") : ic("check")) + esc(msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ===== Modal =====
function modal({ title, body, foot = "", wide = false, onMount }) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal ${wide ? "wide" : ""}"><div class="modal-h"><h3>${title}</h3><button class="x" data-close>${ic("x")}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ""}</div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bg.addEventListener("mousedown", (e) => { if (e.target === bg) close(); });
  $$("[data-close]", bg).forEach((b) => (b.onclick = close));
  document.body.appendChild(bg);
  const m = { el: bg, close, $: (s) => $(s, bg), err(msg) { let e = $(".err", bg); if (!e) { e = document.createElement("div"); e.className = "err"; $(".modal-b", bg).prepend(e); } e.textContent = msg; } };
  onMount && onMount(m);
  const first = $("input:not([type=hidden]),select,textarea", bg);
  if (first && window.innerWidth > 860) first.focus();
  return m;
}
function confirmBox(text, okText = "O'chirish") {
  return new Promise((res) => {
    const m = modal({ title: "Tasdiqlang", body: `<p style="line-height:1.6">${text}</p>`, foot: `<button class="btn ghost" data-close>Bekor qilish</button><button class="btn danger" id="cOk">${okText}</button>` });
    m.$("#cOk").onclick = () => { m.close(); res(true); };
    m.el.addEventListener("remove", () => res(false));
  });
}
function formData(root) {
  const o = {};
  $$("[name]", root).forEach((el) => { o[el.name] = el.type === "checkbox" ? el.checked : el.value; });

}

}

    $("#stList").innerHTML = d.items.length ? `

      ${d.items.map((s, i) => `<tr class="${admin ? "click" : ""}" data-id="${s.id}">

        <td>${s.course ? `<span class="chip"><span class="dot" style="width:8px;height:8px;background:${esc(s.color)}"></span>${esc(s.course)}</span> <span class="muted" style="font-size:12.5px">${esc(s.grp || "")}</span>` : '<span class="muted">Guruhsiz</span>'}</td>
        <td>${fmtDate(s.joined_at)}</td>

        <td><div class="row-acts">${s.status === "active" ? `<button class="btn sm volt" data-pay="${s.id}">To'lov</button>` : ""}<button class="icon-btn" data-edit="${s.id}" title="Tahrirlash">${ic("edit")}</button></div></td>` : `<td>${phoneLink(s.parent_phone)}</td>`}
      </tr>`).join("")}

    if (admin) {
      $$("#stList tr[data-id]").forEach((tr) => (tr.onclick = () => studentCard(+tr.dataset.id, reload)));
      $$("[data-edit]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); studentForm(d.items.find((x) => x.id == b.dataset.edit), reload); }));
      $$("[data-pay]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); payForm(d.items.find((x) => x.id == b.dataset.pay), d.month, reload); }));
    }
  };
  let t;
  $("#fq").oninput = (e) => { f.q = e.target.value; clearTimeout(t); t = setTimeout(reload, 300); };
  $("#fg").onchange = (e) => { f.group = e.target.value; reload(); };
  if (admin) {
    $("#fc").onchange = (e) => { f.course = e.target.value; reload(); };
    $("#fs").onchange = (e) => { f.status = e.target.value; reload(); };
    $("#fp").onchange = (e) => { f.pay = e.target.value; reload(); };
    $("#addSt").onclick = () => studentForm(null, reload);
    if (rest[0] === "new") { history.replaceState(null, "", "#/students"); studentForm(null, reload); }
  }
  await reload();
}

// ===== To'lovlar =====
async function pPayments() {
  const st = state.cache.payState || (state.cache.payState = { month: (state.today || new Date().toISOString()).slice(0, 7), tab: "debt" });
  setHead("To'lovlar", "", `<button class="btn" id="newPay">${ic("plus")}To'lov qabul qilish</button>`);
  $("#newPay").onclick = () => payForm(null, st.month, draw);
  async function draw() {
    const [all, pays] = await Promise.all([api(`students?status=active&month=${st.month}`), api(`payments?month=${st.month}`)]);
    const items = all.items;
    const expected = items.reduce((a, s) => a + (s.price || 0), 0);
    const income = pays.items.reduce((a, p) => a + p.amount, 0);
    const debt = items.filter((s) => s.price && (s.paid || 0) < s.price);
    const debtSum = debt.reduce((a, s) => a + (s.price - (s.paid || 0)), 0);
    const paidN = items.filter((s) => s.paid && (!s.price || s.paid >= s.price)).length;
    $("#psub").textContent = fmtMonth(st.month);
    $("#page").innerHTML = `
      <div class="toolbar">
        <div style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px">
          <button class="icon-btn" style="border:0" id="mPrev">${ic("chevL")}</button><b style="min-width:130px;text-align:center">${fmtMonth(st.month)}</b><button class="icon-btn" style="border:0" id="mNext">${ic("chevR")}</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat hero"><div class="ic">${ic("money")}</div><div><div class="v money">${money(income)}</div><div class="l">Tushgan to'lovlar</div></div></div>
        <div class="stat"><div class="ic b">${ic("wallet")}</div><div><div class="v money">${money(expected)}</div><div class="l">Kutilayotgan summa</div></div></div>
        <div class="stat"><div class="ic r">${ic("alert")}</div><div><div class="v money">${money(debtSum)}</div><div class="l">Qarzdorlik · ${debt.length} o'quvchi</div></div></div>
        <div class="stat"><div class="ic g">${ic("check")}</div><div><div class="v">${paidN} / ${items.length}</div><div class="l">To'liq to'laganlar</div></div></div>
      </div>
      <div class="tabs"><button data-t="debt" class="${st.tab === "debt" ? "on" : ""}">To'lamaganlar (${debt.length})</button><button data-t="hist" class="${st.tab === "hist" ? "on" : ""}">To'lovlar tarixi (${pays.items.length})</button></div>
      <div id="payBody"></div>`;
    $("#mPrev").onclick = () => { st.month = addMonth(st.month, -1); draw(); };
    $("#mNext").onclick = () => { st.month = addMonth(st.month, 1); draw(); };
    $$(".tabs button").forEach((b) => (b.onclick = () => { st.tab = b.dataset.t; draw(); }));
    if (st.tab === "debt") {
      $("#payBody").innerHTML = debt.length ? `<div class="tbl-wrap"><table><thead><tr><th>O'quvchi</th><th>Telefon</th><th>Kurs / guruh</th><th>Oylik</th><th>To'langan</th><th>Qarz</th><th></th></tr></thead><tbody>
        ${debt.map((s) => `<tr><td><div class="who"><div class="ava" style="width:34px;height:34px;font-size:12px">${esc(initials(s.name))}</div><div class="nm">${esc(s.name)}</div></div></td><td>${phoneLink(s.parent_phone || s.phone)}</td><td>${esc(s.course || "")} <span class="muted">${esc(s.grp || "")}</span></td><td class="money">${money(s.price)}</td><td class="money">${s.paid ? money(s.paid) : "—"}</td><td class="money" style="color:var(--bad);font-weight:600">${money(s.price - (s.paid || 0))}</td><td><div class="row-acts"><button class="btn sm volt" data-pay="${s.id}">To'lov qabul qilish</button></div></td></tr>`).join("")}
        </tbody></table></div>` : `<div class="card empty">${ic("check")}<div>Bu oy uchun barcha o'quvchilar to'lagan 🎉</div></div>`;
      $$("[data-pay]").forEach((b) => (b.onclick = () => { const s = debt.find((x) => x.id == b.dataset.pay); payForm({ ...s, price: s.price - (s.paid || 0) }, st.month, draw); }));
    } else {
      $("#payBody").innerHTML = pays.items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Sana</th><th>O'quvchi</th><th>Kurs</th><th>Summa</th><th>Usul</th><th>Izoh</th><th></th></tr></thead><tbody>
        ${pays.items.map((p) => `<tr><td>${fmtDate(p.paid_at)}</td><td><b>${esc(p.student)}</b></td><td>${esc(p.course || "")} <span class="muted">${esc(p.grp || "")}</span></td><td class="money"><b>${money(p.amount)}</b></td><td><span class="chip">${esc(p.method)}</span></td><td class="muted">${esc(p.note || "")}</td><td><div class="row-acts"><button class="icon-btn del" data-dp="${p.id}">${ic("trash")}</button></div></td></tr>`).join("")}
        </tbody></table></div>` : `<div class="card empty">${ic("wallet")}<div>Bu oyda hali to'lov yo'q</div></div>`;
      $$("[data-dp]").forEach((b) => (b.onclick = async () => {
        if (!(await confirmBox("Bu to'lov yozuvi o'chirilsinmi?"))) return;
        try { await api("payments/" + b.dataset.dp, { method: "DELETE" }); toast("O'chirildi"); draw(); } catch (e) { toast(e.message, 1); }
      }));
    }
  }
  await draw();
}

async function pAttendance(rest) {
  const gs = (await groupsList()).filter((g) => g.active);
  const admin = state.me.role === "admin";
  const today = state.today || new Date().toISOString().slice(0, 10);
  const st = state.cache.attState || (state.cache.attState = { group: null, date: today, view: "day", month: today.slice(0, 7) });
  if (rest[0]) st.group = +rest[0];
  if (!gs.find((g) => g.id === st.group)) {
    const dow = dowOf(today);
    st.group = (gs.find((g) => String(g.days).split(",").includes(String(dow))) || gs[0])?.id || null;
  }
  setHead(admin ? "Davomat" : "Yo'qlama", "");
  if (!gs.length) {
    $("#page").innerHTML = `<div class="card empty">${ic("layers")}<div>${admin ? "Avval guruh yarating" : "Sizga hali guruh biriktirilmagan. Administratorga murojaat qiling."}</div></div>`;
    return;
  }
  const g = gs.find((x) => x.id === st.group);
  $("#page").innerHTML = `
    <div class="att-head">
      <select class="sel" id="ag" style="min-width:240px">${gs.map((x) => `<option value="${x.id}" ${x.id === st.group ? "selected" : ""}>${esc(x.name)} · ${esc(x.course)}${x.time ? " · " + esc(x.time) : ""}</option>`).join("")}</select>
      <div class="tabs" style="margin:0"><button data-v="day" class="${st.view === "day" ? "on" : ""}">Kunlik yo'qlama</button><button data-v="month" class="${st.view === "month" ? "on" : ""}">Oylik jadval</button></div>
    </div>
    <div id="attBody"></div>`;
  $("#ag").onchange = (e) => { st.group = +e.target.value; history.replaceState(null, "", "#/attendance/" + st.group); pAttendance([st.group]); };
  $$(".att-head .tabs button").forEach((b) => (b.onclick = () => { st.view = b.dataset.v; pAttendance([st.group]); }));
  $("#psub").textContent = [g.course, g.teacher ? "Ustoz: " + g.teacher : "", String(g.days || "").split(",").filter(Boolean).map((x) => KUNLAR[x - 1]).join(", "), g.time].filter(Boolean).join(" · ");
  if (st.view === "month") return attMonth(g, st);

  const body = $("#attBody");
  body.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  const d = await api(`attendance?group=${g.id}&date=${st.date}`);
  const marks = Object.fromEntries(d.items.map((s) => [s.id, s.status || ""]));
  const wasMarked = d.items.some((s) => s.status);
  const isLessonDay = String(g.days).split(",").includes(String(dowOf(st.date)));
  body.innerHTML = `
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px">
        <button class="icon-btn" style="border:0" id="dPrev">${ic("chevL")}</button>
        <input type="date" class="inp" id="ad" value="${st.date}" ${admin ? "" : `max="${today}"`} style="border:0;height:34px;padding:0 6px">
        <button class="icon-btn" style="border:0" id="dNext" ${!admin && st.date >= today ? "disabled" : ""}>${ic("chevR")}</button>
      </div>
      <span class="muted">${KUNLAR_TOLIQ[dowOf(st.date) - 1]}${isLessonDay ? "" : " · bu kunda dars jadvalda yo'q"}</span>
      ${wasMarked ? '<span class="badge b-ok">Yo\'qlama qilingan</span>' : '<span class="badge b-warn">Hali yo\'qlama qilinmagan</span>'}
      <button class="btn sm ghost" id="allIn" style="margin-left:auto">${ic("check")}Hammasi keldi</button>
    </div>
    ${d.items.length ? `<div class="att-list">${d.items.map((s, i) => `
      <div class="att-row" data-s="${s.id}">
        <div class="n">${i + 1}</div><div class="ava" style="width:36px;height:36px;font-size:12px">${esc(initials(s.name))}</div>
        <div class="grow"><div class="nm">${esc(s.name)}</div><div class="ph">${s.parent_phone ? "Ota-ona: " + phoneLink(s.parent_phone) : s.phone ? phoneLink(s.phone) : ""}</div></div>
        <div class="seg">${Object.entries(ATT).map(([k, [t]]) => `<button data-st="${k}" class="${k} ${marks[s.id] === k ? "on" : ""}">${t}</button>`).join("")}</div>
      </div>`).join("")}</div>
      <div class="savebar"><div class="grow" id="attSum"></div><button class="btn volt" id="attSave">${ic("check")}Saqlash</button></div>`
      : `<div class="card empty">${ic("users")}<div>Bu guruhda faol o'quvchi yo'q</div></div>`}`;
  const sum = () => {
    const v = Object.values(marks);
    const c = (k) => v.filter((x) => x === k).length;
    const left = v.filter((x) => !x).length;
    const el = $("#attSum");
    if (el) el.innerHTML = `<b>${c("keldi") + c("kechikdi")}</b> keldi · <b>${c("kelmadi")}</b> kelmadi${c("sababli") ? ` · <b>${c("sababli")}</b> sababli` : ""}${left ? ` · <span style="color:var(--volt)">${left} ta belgilanmagan</span>` : ""}`;
  };
  sum();
  $$(".att-row").forEach((r) => $$("[data-st]", r).forEach((b) => (b.onclick = () => {
    const id = +r.dataset.s;
    marks[id] = marks[id] === b.dataset.st ? "" : b.dataset.st;
    $$("[data-st]", r).forEach((x) => x.classList.toggle("on", x.dataset.st === marks[id]));
    sum();
  })));
  const go = (k) => { const dt = new Date(st.date + "T00:00:00Z"); dt.setUTCDate(dt.getUTCDate() + k); st.date = dt.toISOString().slice(0, 10); if (!admin && st.date > today) st.date = today; pAttendance([g.id]); };
  $("#dPrev").onclick = () => go(-1);
  $("#dNext").onclick = () => go(1);
  $("#ad").onchange = (e) => { if (e.target.value) { st.date = e.target.value; pAttendance([g.id]); } };
  const all = $("#allIn");
  if (all) all.onclick = () => { $$(".att-row").forEach((r) => { const id = +r.dataset.s; if (!marks[id]) { marks[id] = "keldi"; $$("[data-st]", r).forEach((x) => x.classList.toggle("on", x.dataset.st === "keldi")); } }); sum(); };
  const sv = $("#attSave");
  if (sv) sv.onclick = () => submitBtn(sv, async () => {
    try {
      await api("attendance", { method: "POST", body: { group_id: g.id, date: st.date, items: Object.entries(marks).map(([student_id, status]) => ({ student_id: +student_id, status })) } });
      toast("Yo'qlama saqlandi");
      const b = $(".toolbar .badge"); if (b) { b.className = "badge b-ok"; b.textContent = "Yo'qlama qilingan"; }
    } catch (e) { toast(e.message, 1); }
  });
}
async function attMonth(g, st) {
  const body = $("#attBody");
  body.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  const d = await api(`attendance?group=${g.id}&month=${st.month}`);
  const [y, m] = st.month.split("-").map(Number);
  const nDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const gd = String(g.days).split(",");
  const recDates = new Set(d.records.map((r) => r.date));
  const dates = [];
  for (let i = 1; i <= nDays; i++) {
    const ds = `${st.month}-${String(i).padStart(2, "0")}`;
    if (gd.includes(String(dowOf(ds))) || recDates.has(ds)) dates.push(ds);
  }
  const map = {};
  d.records.forEach((r) => (map[r.student_id + "|" + r.date] = r.status));
  body.innerHTML = `
    <div class="toolbar"><div style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px"><button class="icon-btn" style="border:0" id="mPrev">${ic("chevL")}</button><b style="min-width:130px;text-align:center">${fmtMonth(st.month)}</b><button class="icon-btn" style="border:0" id="mNext">${ic("chevR")}</button></div></div>
    ${d.students.length ? `<div class="tbl-wrap"><table class="mx"><thead><tr><th>O'quvchi</th>${dates.map((ds) => `<th title="${fmtDate(ds)}">${+ds.slice(8)}<div style="font-weight:400;font-size:10px">${KUNLAR[dowOf(ds) - 1]}</div></th>`).join("")}<th>Davomat</th></tr></thead><tbody>
      ${d.students.map((s) => {
        let p = 0, t = 0;
        const cells = dates.map((ds) => { const v = map[s.id + "|" + ds]; if (v) { t++; if (v === "keldi" || v === "kechikdi") p++; } return `<td>${v ? `<span class="c ${v}" title="${ATT[v][0]}">${ATT[v][1]}</span>` : '<span class="muted">·</span>'}</td>`; }).join("");
        const pc = t ? Math.round((p / t) * 100) : null;
        return `<tr><td><b>${esc(s.name)}</b></td>${cells}<td class="pct" style="color:${pc == null ? "var(--gray)" : pc >= 80 ? "var(--ok)" : pc >= 60 ? "var(--warn)" : "var(--bad)"}">${pc == null ? "—" : pc + "%"}</td></tr>`;
      }).join("")}
    </tbody></table></div>
    <div class="legend">${Object.entries(ATT).map(([k, [t, s]]) => `<span><span class="c ${k}" style="width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${s}</span>${t}</span>`).join("")}</div>`
    : `<div class="card empty">Bu guruhda o'quvchi yo'q</div>`}`;
  $("#mPrev").onclick = () => { st.month = addMonth(st.month, -1); attMonth(g, st); };
  $("#mNext").onclick = () => { st.month = addMonth(st.month, 1); attMonth(g, st); };
}

// ===== Arizalar =====
const LS = { yangi: ["Yangi", "b-warn"], boglanildi: ["Bog'lanildi", "b-blue"], yozildi: ["Kursga yozildi", "b-ok"], rad: ["Rad etdi", "b-gray"] };
async function pLeads() {
  const d = await api("leads");
  const f = state.cache.leadF || (state.cache.leadF = "");
  const items = f ? d.items.filter((x) => x.status === f) : d.items;
  setHead("Arizalar", "Saytdagi formadan kelgan murojaatlar shu yerga avtomatik tushadi", `<button class="btn ghost" id="addL">${ic("plus")}Qo'lda qo'shish</button>`);
  $("#addL").onclick = () => leadForm();
  $("#page").innerHTML = `
    <div class="tabs">${[["", "Hammasi", d.items.length], ...Object.entries(LS).map(([k, [t]]) => [k, t, d.items.filter((x) => x.status === k).length])].map(([k, t, n]) => `<button data-f="${k}" class="${f === k ? "on" : ""}">${t} (${n})</button>`).join("")}</div>
    ${items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Sana</th><th>Ism</th><th>Telefon</th><th>Xabar</th><th>Holat</th><th></th></tr></thead><tbody>
      ${items.map((l) => `<tr><td class="muted" style="white-space:nowrap">${fmtDate(l.created_at)}<div style="font-size:12px">${esc(l.created_at.slice(11, 16))}</div></td><td><b>${esc(l.name)}</b></td><td>${phoneLink(l.phone)}</td><td class="wrap" style="min-width:220px;max-width:340px">${esc(l.message || "—")}</td>
        <td><select class="sel" data-s="${l.id}" style="height:34px">${Object.entries(LS).map(([k, [t]]) => `<option value="${k}" ${l.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
        <td><div class="row-acts">${l.status !== "yozildi" ? `<button class="btn sm volt" data-st="${l.id}">${ic("user_plus")}O'quvchi qilish</button>` : ""}<button class="icon-btn del" data-d="${l.id}">${ic("trash")}</button></div></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="card empty">${ic("inbox")}<div>Ariza yo'q</div></div>`}`;
  $$(".tabs [data-f]").forEach((b) => (b.onclick = () => { state.cache.leadF = b.dataset.f; pLeads(); }));
  $$("[data-s]").forEach((s) => (s.onchange = async () => { try { await api("leads/" + s.dataset.s, { method: "PUT", body: { status: s.value } }); toast("Holat yangilandi"); refreshLeadCount(); } catch (e) { toast(e.message, 1); } }));
  $$("[data-d]").forEach((b) => (b.onclick = async () => { if (!(await confirmBox("Ariza o'chirilsinmi?"))) return; await api("leads/" + b.dataset.d, { method: "DELETE" }); toast("O'chirildi"); pLeads(); refreshLeadCount(); }));
  $$("[data-st]").forEach((b) => (b.onclick = async () => { const l = d.items.find((x) => x.id == b.dataset.st); await groupsList(); studentForm(null, () => { pLeads(); refreshLeadCount(); }, { name: l.name, phone: l.phone, note: l.message, lead_id: l.id }); }));
  refreshLeadCount();
}
function leadForm() {
  const m = modal({
    title: "Yangi ariza",
    body: `<form class="form" id="lf2"><div class="f"><label>Ism *</label><input class="inp" name="name"></div><div class="f"><label>Telefon</label><input class="inp" name="phone" value="+998 "></div><div class="f full"><label>Izoh</label><textarea class="inp" name="message" rows="3" placeholder="Qaysi kursga qiziqyapti, qachon qo'ng'iroq qilish kerak..."></textarea></div></form>`,
    foot: `<button class="btn ghost" data-close>Bekor qilish</button><button class="btn" id="save">Saqlash</button>`,
  });
  m.$("#save").onclick = () => submitBtn(m.$("#save"), async () => { try { await api("leads", { method: "POST", body: formData(m.$("#lf2")) }); m.close(); toast("Ariza qo'shildi"); pLeads(); } catch (e) { m.err(e.message); } });
}

// ===== Sozlamalar =====
async function pSettings() {
  setHead("Sozlamalar", "");
  $("#page").innerHTML = `
    <div class="grid g2">
      <div class="card"><h3>${ic("key")} Parolni almashtirish</h3>
        <form class="form" id="pwf" style="grid-template-columns:1fr">
          <div class="f"><label>Hozirgi parol</label><input class="inp" type="password" name="old" autocomplete="current-password"></div>
          <div class="f"><label>Yangi parol</label><input class="inp" type="password" name="new" autocomplete="new-password"><span class="hint">Kamida 6 belgi</span></div>
          <div class="f"><label>Yangi parolni takrorlang</label><input class="inp" type="password" name="new2" autocomplete="new-password"></div>
          <div><button class="btn">Parolni saqlash</button></div>
        </form></div>
      <div class="card"><h3>${ic("users")} Hisob</h3>
        <div class="info-grid" style="grid-template-columns:1fr">
          <div><span>Ism</span><b>${esc(state.me.name)}</b></div>
          <div><span>Login</span><b>${esc(state.me.login)}</b></div>
          <div><span>Rol</span><b>${state.me.role === "admin" ? "Administrator" : "Ustoz"}</b></div>
        </div>
        <p class="muted" style="font-size:12.5px;line-height:1.6">Parol almashtirilganda boshqa qurilmalardagi kirishlar avtomatik yopiladi.</p>
      </div>
    </div>`;
  $("#pwf").onsubmit = (e) => {
    e.preventDefault();
    const b = formData(e.target);
    submitBtn($("button", e.target), async () => {
      if (b.new !== b.new2) return toast("Yangi parollar bir xil emas", 1);
      try { await api("me/password", { method: "POST", body: b }); toast("Parol almashtirildi"); e.target.reset(); } catch (er) { toast(er.message, 1); }
    });
  };
}

// ===== USTOZ: Bosh sahifa =====
async function pTeacherHome() {
  const gs = (await groupsList()).filter((g) => g.active);
  const today = state.today;
  const dow = dowOf(today);
  const todays = gs.filter((g) => String(g.days).split(",").includes(String(dow))).sort((a, b) => String(a.time).localeCompare(String(b.time)));
  const totalSt = gs.reduce((a, g) => a + g.students, 0);
  const h = +new Date().getHours();
  setHead(`${h < 12 ? "Xayrli tong" : h < 18 ? "Xayrli kun" : "Xayrli kech"}, ${state.me.name.split(" ")[0]}!`, `${KUNLAR_TOLIQ[dow - 1]}, ${fmtDate(today)}`);
  const marks = await Promise.all(todays.map((g) => api(`attendance?group=${g.id}&date=${today}`).then((d) => d.items.some((s) => s.status)).catch(() => false)));
  $("#page").innerHTML = `
    <div class="stats">
      <div class="stat hero"><div class="ic">${ic("layers")}</div><div><div class="v">${gs.length}</div><div class="l">Guruhlarim</div></div></div>
      <div class="stat"><div class="ic b">${ic("users")}</div><div><div class="v">${totalSt}</div><div class="l">O'quvchilarim</div></div></div>
      <div class="stat"><div class="ic v">${ic("clock")}</div><div><div class="v">${todays.length}</div><div class="l">Bugungi darslar</div></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>${ic("clock")} Bugungi darslar</h3>
        ${todays.length ? todays.map((g, i) => `<div class="lesson"><div class="tm">${esc((g.time || "").split(/[–-]/)[0] || "—")}<small>${esc(g.room || "")}</small></div><div class="grow"><div class="t">${esc(g.name)}</div><div class="s">${esc(g.course)} · ${g.students} o'quvchi</div></div>${marks[i] ? '<span class="badge b-ok">Qilingan</span>' : ""}<a class="btn sm ${marks[i] ? "ghost" : ""}" href="#/attendance/${g.id}">${marks[i] ? "Ko'rish" : "Yo'qlama qilish"}</a></div>`).join("")
          : `<div class="empty" style="padding:24px">Bugun darsingiz yo'q 🙂</div>`}
      </div>
      <div class="card"><h3>${ic("layers")} Barcha guruhlarim</h3>
        ${gs.length ? gs.map((g) => `<div class="list-item"><span class="dot" style="background:${esc(g.color)}"></span><div class="grow"><div class="t">${esc(g.name)} <span class="muted" style="font-weight:400">· ${esc(g.course)}</span></div><div class="s">${esc(g.time || "")} · ${g.students} o'quvchi</div><div style="margin-top:6px">${daysHtml(g.days)}</div></div><a class="icon-btn" href="#/attendance/${g.id}" title="Yo'qlama">${ic("check")}</a></div>`).join("")
          : `<div class="empty" style="padding:24px">Sizga hali guruh biriktirilmagan</div>`}
      </div>
    </div>`;
}

// ===== Ishga tushirish =====
async function boot() {
  try {
    const d = await api("me");
    state.me = d.user;
    state.today = d.today;
  } catch { if (!state.me) return renderLogin(); }
  state.cache = {};
  shell();
  if (state.me.role === "admin") refreshLeadCount();
  await route();
}
window.addEventListener("hashchange", route);
boot();
</script>
